# PURPOSE: Make Lab 1's topology-blind result deterministic on every laptop.
# USED BY: `make lab1-demo`; deleted by `make lab1-reset`.
# PRECONDITION: Checkpoint 1 has published one fake GPU on each worker.
# ACTION: Occupy worker (leaf-a) and worker3 (leaf-b), one GPU each.
# RESULT: Only worker2 (leaf-a) and worker4 (leaf-b) remain feasible for the
# two topology-unaware trainer Pods, forcing a demonstrable cross-leaf result.
# IMPORTANT: These are capacity holders, not simulated training processes.
apiVersion: v1
kind: Pod
metadata:
  name: leaf-a-filler
  namespace: training
  labels:
    workshop.example.com/role: placement-filler
spec:
  # Direct pinning is intentional here: this Pod creates experiment conditions.
  nodeSelector:
    kubernetes.io/hostname: topology-lab-worker
  automountServiceAccountToken: false
  terminationGracePeriodSeconds: 1
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  containers:
  - name: holder
    image: registry.k8s.io/e2e-test-images/agnhost:2.53
    # `pause` remains alive until reset; it consumes capacity without doing work.
    args: ["pause"]
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
      readOnlyRootFilesystem: true
    resources:
      # Extended resources must appear in both requests and limits with the same value.
      requests:
        workshop.example.com/gpu: 1
      limits:
        workshop.example.com/gpu: 1
---
apiVersion: v1
kind: Pod
metadata:
  name: leaf-b-filler
  namespace: training
  labels:
    workshop.example.com/role: placement-filler
spec:
  # Pin the second holder to the other leaf, leaving one free worker per leaf.
  nodeSelector:
    kubernetes.io/hostname: topology-lab-worker3
  automountServiceAccountToken: false
  terminationGracePeriodSeconds: 1
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  containers:
  - name: holder
    image: registry.k8s.io/e2e-test-images/agnhost:2.53
    # The short termination grace period keeps live resets bounded.
    args: ["pause"]
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
      readOnlyRootFilesystem: true
    resources:
      requests:
        workshop.example.com/gpu: 1
      limits:
        workshop.example.com/gpu: 1
